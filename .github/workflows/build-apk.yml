name: Build & Release Blake APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Select verification tier
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import subprocess

          tier = "full"
          if os.environ.get("GITHUB_EVENT_NAME") == "pull_request":
              try:
                  parents = subprocess.check_output(
                      ["git", "rev-list", "--parents", "-n", "1", "HEAD"], text=True
                  ).strip().split()
                  if len(parents) == 3:
                      raw = subprocess.check_output(
                          ["git", "diff", "--name-only", "-z", parents[1], parents[0]]
                      )
                      paths = [os.fsdecode(part) for part in raw.split(b"\0") if part]
                      if paths and all(
                          p in ("README.md", "TASK_PROGRESS.md") or p.startswith("docs/")
                          for p in paths
                      ):
                          tier = "docs"
                      elif paths and all(p.startswith("app/src/test/") for p in paths):
                          tier = "tests"
              except (OSError, subprocess.CalledProcessError) as error:
                  print(f"Could not classify PR paths; using full verification: {error}")
          print(f"Verification tier: {tier}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"tier={tier}\n")
          PY

      - name: Setup Java JDK
        if: steps.scope.outputs.tier != 'docs'
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        if: steps.scope.outputs.tier != 'docs'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Ensure Gradle Wrapper
        if: steps.scope.outputs.tier != 'docs'
        run: |
          if [ ! -f "gradlew" ] || [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            gradle wrapper --gradle-version 9.6.0
          fi
          chmod +x gradlew

      - name: Run Unit Tests
        if: steps.scope.outputs.tier != 'docs'
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug APK (PR check)
        if: github.event_name == 'pull_request' && steps.scope.outputs.tier == 'full'
        run: ./gradlew assembleDebug --stacktrace

      - name: Build & Verify Signed Release APK (main)
        if: github.event_name != 'pull_request'
        env:
          BLAKE_KEYSTORE_BASE64: ${{ secrets.BLAKE_KEYSTORE_BASE64 }}
          BLAKE_KEYSTORE_PASSWORD: ${{ secrets.BLAKE_KEYSTORE_PASSWORD }}
          BLAKE_KEY_ALIAS: ${{ secrets.BLAKE_KEY_ALIAS }}
          BLAKE_KEY_PASSWORD: ${{ secrets.BLAKE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$BLAKE_KEYSTORE_BASE64"
          KEYSTORE="$RUNNER_TEMP/blake-release.p12"
          printf '%s' "$BLAKE_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
          export BLAKE_KEYSTORE_PATH="$KEYSTORE"

          ./gradlew assembleRelease --stacktrace

          APK=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*-release.apk' -print -quit)
          test -n "$APK"

          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" > release-badging.txt
          grep -F "package: name='com.blake.notes'" release-badging.txt
          grep -F "application-label:'Blake'" release-badging.txt
          grep -F "launchable-activity: name='com.blake.editor.ui.main.MainActivity'" release-badging.txt
          test "$(grep -c '^launchable-activity:' release-badging.txt)" -eq 1

          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          test -n "$VERSION"
          OUT_NAME="Blake-v${VERSION}.apk"
          mkdir -p release-output
          cp -- "$APK" "release-output/$OUT_NAME"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk_name=$OUT_NAME" >> "$GITHUB_OUTPUT"
        id: release_apk

      - name: Cleanup temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/blake-release.p12"

      - name: Publish Direct APK to GitHub Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release_apk.outputs.version }}
          APK_NAME: ${{ steps.release_apk.outputs.apk_name }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          APK_PATH="release-output/${APK_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_PATH" --clobber
          else
            gh release create "$TAG" "$APK_PATH" \
              --title "Blake ${TAG}" \
              --notes "Direct ready-to-install Android APK for **Blake ${VERSION}** (\`com.blake.notes\`). Tap \`${APK_NAME}\` on your phone to install or update in-place."
          fi
