name: Build Debug APK

on:
  workflow_dispatch:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Select verification tier
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import subprocess

          tier = "full"
          paths = []
          if os.environ.get("GITHUB_EVENT_NAME") == "pull_request":
              try:
                  parents = subprocess.check_output(
                      ["git", "rev-list", "--parents", "-n", "1", "HEAD"], text=True
                  ).strip().split()
                  if len(parents) == 3:
                      raw = subprocess.check_output(
                          ["git", "diff", "--name-only", "-z", parents[1], parents[0]]
                      )
                      paths = [os.fsdecode(part) for part in raw.split(b"\0") if part]
                      if paths and all(
                          p in ("README.md", "TASK_PROGRESS.md") or p.startswith("docs/")
                          for p in paths
                      ):
                          tier = "docs"
                      elif paths and all(p.startswith("app/src/test/") for p in paths):
                          tier = "tests"
              except (OSError, subprocess.CalledProcessError) as error:
                  print(f"Could not classify PR paths; using full verification: {error}")
          print(f"Verification tier: {tier} | Changed files: {len(paths)}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"tier={tier}\n")
          PY

      - name: Setup Java JDK
        if: steps.scope.outputs.tier != 'docs'
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        if: steps.scope.outputs.tier != 'docs'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Ensure Gradle Wrapper
        if: steps.scope.outputs.tier != 'docs'
        run: |
          if [ ! -f "gradlew" ] || [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            gradle wrapper --gradle-version 9.6.0
          fi
          chmod +x gradlew

      - name: Run Unit Tests & Build Debug APK
        if: steps.scope.outputs.tier == 'full'
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Run Unit Tests Only (no APK)
        if: steps.scope.outputs.tier == 'tests'
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload Debug APK Artifact
        if: steps.scope.outputs.tier == 'full'
        uses: actions/upload-artifact@v7
        with:
          name: BlakeEditor-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Build Release Variant (unsigned)
        if: steps.scope.outputs.tier == 'full'
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify Release Manifest and Clean Packaging
        if: steps.scope.outputs.tier == 'full'
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$APK"
          AAPT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt"
          "$AAPT" dump badging "$APK" > release-badging.txt
          grep -F "package: name='com.blake.editor.personal'" release-badging.txt
          grep -F "versionCode='2'" release-badging.txt
          grep -F "application-label:'Blake'" release-badging.txt
          grep -F "launchable-activity: name='com.blake.editor.ui.main.MainActivity'" release-badging.txt
          test "$(grep -c '^launchable-activity:' release-badging.txt)" -eq 1
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > release-manifest-tree.txt
          grep -F 'ExternalFileRouterActivity' release-manifest-tree.txt
          grep -F 'LargeFileReaderActivity' release-manifest-tree.txt
          if "$AAPT" list "$APK" | grep -Eq '^assets/(editor|reader)/'; then
            echo "ERROR: Legacy WebView/Ace assets found in APK"
            exit 1
          fi

      - name: Stage Blake unsigned release APK
        if: steps.scope.outputs.tier == 'full'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t candidates < <(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*-unsigned.apk' -print)
          test "${#candidates[@]}" -eq 1
          mkdir -p blake-personal-output
          cp -- "${candidates[0]}" blake-personal-output/BlakePersonal-UNSIGNED.apk
          sha256sum blake-personal-output/BlakePersonal-UNSIGNED.apk

      - name: Upload Blake UNSIGNED APK (sign before installing)
        if: steps.scope.outputs.tier == 'full'
        uses: actions/upload-artifact@v7
        with:
          name: BlakePersonal-UNSIGNED-SIGN-FIRST
          path: blake-personal-output/BlakePersonal-UNSIGNED.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build Side-by-Side Isolated Test APK
        if: steps.scope.outputs.tier == 'full'
        run: ./gradlew clean assembleDebug "-PisolatedTestApkSuffix=.test${{ github.run_id }}a${{ github.run_attempt }}" --stacktrace

      - name: Verify Isolated Test Package ID
        if: steps.scope.outputs.tier == 'full'
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$APK"
          AAPT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.blake.editor.personal.test${{ github.run_id }}a${{ github.run_attempt }}'"
          LABEL="Blake T${GITHUB_RUN_ID: -6}a${GITHUB_RUN_ATTEMPT}"
          "$AAPT" dump badging "$APK" | grep -F "label='$LABEL'"
          "$AAPT" dump badging "$APK" | grep -F "launchable-activity: name='com.blake.editor.ui.main.MainActivity'"
          test "$("$AAPT" dump badging "$APK" | grep -c '^launchable-activity:')" -eq 1

      - name: Upload Isolated Test APK Artifact
        if: steps.scope.outputs.tier == 'full'
        uses: actions/upload-artifact@v7
        with:
          name: BlakeEditor-Isolated-Test-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
